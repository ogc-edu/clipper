packages:
  - "apps/*"
  - "packages/*"
  - "infra"

# Single source of truth for shared dependency versions across the workspace.
# Packages reference these with `"catalog:"` in their package.json.
#
# `allowBuilds` controls which dependencies may run install scripts. esbuild
# (used by vitest and tsx) needs its install script to link the platform
# binary.
allowBuilds:
  esbuild: true

catalog:
  "@eslint/js": ^10.0.1
  "@next/eslint-plugin-next": ^16.3.5
  "@types/node": ^26.6.2
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  eslint: ^10.11.0
  eslint-config-prettier: ^10.1.8
  globals: ^17.12.0
  next: ^16.3.5
  prettier: ^3.9.8
  react: ^19.3.0
  react-dom: ^19.3.0
  typescript: ~5.9.3
  typescript-eslint: ^8.70.0
  vite: ^8.3.0
  vitest: ^5.0.1
  zod: ^4.6.5
